<title>Vocabulary Sorter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one index-card slip centred on a cool desk; a 2x2 verdict grid underneath, keyed 1-4. */
:root {
  --desk: #e9edf1;
  --slip: #fbfcfd;
  --ink: #1b2230;
  --muted: #5d6878;
  --rule: #c9d1db;
  --accent: #2f5d8a;
  --accent-ink: #ffffff;
  --display: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #12161d; --slip: #1b212b; --ink: #e4e9f0; --muted: #98a3b3;
    --rule: #2f3846; --accent: #7fa8d6; --accent-ink: #0e1420; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #12161d; --slip: #1b212b; --ink: #e4e9f0; --muted: #98a3b3;
  --rule: #2f3846; --accent: #7fa8d6; --accent-ink: #0e1420; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--desk); color: var(--ink); font-family: var(--body); font-size: 16px;
  padding: 24px 16px; box-sizing: border-box;
}
main { max-width: 34rem; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.25rem; margin: 0; }
.progress { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

.slip {
  background: var(--slip); border: 1px solid var(--rule); border-radius: 4px;
  padding: 28px 24px 24px; min-height: 11rem; display: grid; align-content: start; gap: 10px;
  background-image: linear-gradient(transparent calc(3.2rem - 1px), var(--rule) calc(3.2rem - 1px), var(--rule) 3.2rem, transparent 3.2rem);
  background-repeat: no-repeat;
}
.headword { font-family: var(--display); font-size: 2.1rem; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.pos { font-family: var(--display); font-style: italic; color: var(--muted); font-size: 1rem; margin-left: .4em; }
.def { margin: 8px 0 0; line-height: 1.55; font-size: 1.05rem; max-width: 60ch; }
.meta { font-size: 0.78rem; color: var(--muted); letter-spacing: .02em; }

.grid { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: stretch; }
.grid .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); align-self: center; }
.grid .col { text-align: center; }
button.v {
  font: inherit; font-size: .95rem; padding: 14px 10px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--slip); color: var(--ink);
  display: flex; gap: 8px; align-items: center; justify-content: center; min-width: 0;
}
button.v.add { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.v kbd { font-family: var(--body); font-size: .75rem; opacity: .75; border: 1px solid currentColor; border-radius: 3px; padding: 0 5px; }
button.v:focus-visible, button.u:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.v:disabled { opacity: .4; cursor: default; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
button.u { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; }
.tally { font-variant-numeric: tabular-nums; }
.status { font-size: .85rem; color: var(--muted); }
.done { text-align: center; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<main>
  <header>
    <h1>Vocabulary Sorter</h1>
    <span class="progress" id="progress">loading</span>
  </header>
  <div class="bar"><i id="bar"></i></div>

  <section class="slip" id="slip" aria-live="polite">
    <p class="headword" id="word">…</p>
    <p class="def" id="def"></p>
    <p class="meta" id="meta"></p>
  </section>

  <div class="grid" role="group" aria-label="Verdict">
    <span></span><span class="lbl col">Add to deck</span><span class="lbl col">Skip</span>
    <span class="lbl">New to me</span>
    <button class="v add" id="b1" data-v="new-add"><kbd>1</kbd> New, add</button>
    <button class="v" id="b2" data-v="new-skip"><kbd>2</kbd> Too obscure</button>
    <span class="lbl">I know it</span>
    <button class="v add" id="b3" data-v="known-add"><kbd>3</kbd> Known, add</button>
    <button class="v" id="b4" data-v="known-skip"><kbd>4</kbd> Too easy</button>
  </div>

  <div class="foot">
    <button class="u" id="undo">Undo last (Z)</button>
    <span class="tally" id="tally"></span>
  </div>
  <p class="status" id="status"></p>
</main>

<script>
// The batch this page sorts. scripts/vocab.py rewrites this line; each entry is
// {w: headword, p: part of speech, d: short definition, z: Zipf frequency}.
const BATCH = [];
const BATCH_ID = "";

const KEYS = { "1": "new-add", "2": "new-skip", "3": "known-add", "4": "known-skip" };
const verdicts = {};      // word -> verdict, mirrored from the store
const history = [];       // words judged in this view, for undo
let db = null;

const $ = id => document.getElementById(id);
const docId = w => w.toLowerCase().replace(/[^a-z0-9-]/g, "_");

function current() { return BATCH.find(e => !verdicts[e.w]); }

function render() {
  const done = BATCH.filter(e => verdicts[e.w]).length;
  $("progress").textContent = BATCH.length ? `${done} of ${BATCH.length}` : "no batch loaded";
  $("bar").style.width = BATCH.length ? `${100 * done / BATCH.length}%` : "0";
  const counts = { "new-add": 0, "new-skip": 0, "known-add": 0, "known-skip": 0 };
  BATCH.forEach(e => { if (verdicts[e.w]) counts[verdicts[e.w]]++; });
  $("tally").textContent = `add ${counts["new-add"] + counts["known-add"]} · obscure ${counts["new-skip"]} · easy ${counts["known-skip"]}`;
  $("undo").disabled = !history.length;

  const e = current();
  const btns = document.querySelectorAll("button.v");
  btns.forEach(b => b.disabled = !e);
  if (!e) {
    $("slip").classList.add("done");
    $("word").textContent = BATCH.length ? "Batch done" : "No batch yet";
    $("def").textContent = BATCH.length ? "Tell Claude the batch is sorted." : "Claude publishes a batch of candidate words here.";
    $("meta").textContent = "";
    return;
  }
  $("slip").classList.remove("done");
  $("word").innerHTML = "";
  $("word").append(e.w);
  if (e.p) { const s = document.createElement("span"); s.className = "pos"; s.textContent = e.p; $("word").append(s); }
  $("def").textContent = e.d || "";
  $("meta").textContent = e.z != null ? `Zipf ${e.z.toFixed(2)}` : "";
}

async function judge(v) {
  const e = current();
  if (!e) return;
  verdicts[e.w] = v;
  history.push(e.w);
  render();
  if (!db) return;
  try {
    await db.collection("verdicts").doc(docId(e.w)).set({ word: e.w, verdict: v, batch: BATCH_ID, at: new Date().toISOString() });
    $("status").textContent = "";
  } catch (err) {
    $("status").textContent = `Not saved (${err.code || err.message}). Keep going; reload to retry.`;
  }
}

async function undo() {
  const w = history.pop();
  if (!w) return;
  delete verdicts[w];
  render();
  if (db) { try { await db.collection("verdicts").doc(docId(w)).delete(); } catch (err) {} }
}

document.querySelectorAll("button.v").forEach(b => b.addEventListener("click", () => judge(b.dataset.v)));
$("undo").addEventListener("click", undo);
document.addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (KEYS[ev.key]) { ev.preventDefault(); judge(KEYS[ev.key]); }
  else if (ev.key === "z" || ev.key === "Z" || ev.key === "Backspace") { ev.preventDefault(); undo(); }
});

render();
(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (!db) { $("status").textContent = "Verdicts are not being saved in this view. Open the page signed in on claude.ai."; return; }
  // Resume: words already judged (in any batch) are skipped.
  db.collection("verdicts").onSnapshot(snap => {
    for (const k in verdicts) if (!history.includes(k)) delete verdicts[k];
    snap.docs.forEach(d => { const x = d.data(); if (x && x.word && x.verdict) verdicts[x.word] = x.verdict; });
    render();
  }, err => { $("status").textContent = `Could not load saved verdicts (${err.code}).`; });
})();
</script>
